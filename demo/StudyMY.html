    function getInstitutionBand(uni) {
        return uni.type === '公立' ? '公立大学' : '私立大学';
    }

    function getBandChipClass(band) {
        const map = {
            '公立大学': 'bg-blue-100 text-blue-700',
            '私立大学': 'bg-amber-100 text-amber-700',
        };
        return map[band] || 'bg-gray-100 text-gray-600';
    }

    function getBandCounts() {
        const counts = {'公立大学':0,'私立大学':0};
        universities.forEach(u => {
            const band = getInstitutionBand(u);
            counts[band] = (counts[band] || 0) + 1;
        });
        return counts;
    }

    function getMaskedAccount(account, method) {
        if (!account) return '会员用户';
        if (method === '手机号') return account.replace(/(\d{3})\d+(\d{2,4})/, '$1****$2');
        if (account.includes('@')) {
            const [name, domain] = account.split('@');
            return `${name.slice(0,2)}***@${domain}`;
        }
        return account;
    }

    function getMaterialStatusMeta(status) {
        return {
            wait: { label: '待准备', cls: 'status-wait', sort: 1 },
            draft: { label: '待起草', cls: 'status-draft', sort: 0 },
            progress: { label: '准备中', cls: 'status-progress', sort: 2 },
            done: { label: '已完成', cls: 'status-done', sort: 3 }
        }[status] || { label: '待处理', cls: 'status-wait', sort: 0 };
    }

    function getApplicationStageMeta(stage) {
        const map = {
            '待创建': { label: '待创建', cls: 'status-draft', desc: '尚未进入正式递交流程' },
            '材料准备中': { label: '材料准备中', cls: 'status-progress', desc: '核心材料仍在补齐中' },
            '待递交': { label: '待递交', cls: 'status-progress', desc: '已接近正式提交节点' },
            '院校审核中': { label: '院校审核中', cls: 'status-progress', desc: '院校端正在审理或等待反馈' },
            'Conditional Offer': { label: 'Conditional Offer', cls: 'status-wait', desc: '已获条件录取，需补齐条件' },
            '签证准备': { label: '签证准备', cls: 'status-done', desc: '已进入录取后办理阶段' }
        };
        return map[stage] || { label: stage, cls: 'status-wait', desc: '状态说明待补充' };
    }

        if (p.level) score += 16;
        if (p.targetCategory) score += 16;
        if (p.gpa > 0) score += 18;
        if (p.ielts > 0) score += 16;
        if (p.budget > 0) score += 16;
        if (p.experience) score += 8;
        if (typeof p.acceptNoLanguage === 'boolean') score += 10;
        return Math.min(100, score);
    }

    function filterUniversities() {
        let filtered = universities;
        const f = state.filters;
        if (f.search) {
            const s = f.search.toLowerCase();
            filtered = filtered.filter(u =>
                u.name.toLowerCase().includes(s) ||
                u.nameEn.toLowerCase().includes(s) ||
                u.location.toLowerCase().includes(s) ||
                u.programs.some(p => p.name.toLowerCase().includes(s) || p.nameEn.toLowerCase().includes(s) || p.category.toLowerCase().includes(s))
            );
        }
        if (f.qsRankMax < 1200) filtered = filtered.filter(u => u.qsRank <= f.qsRankMax);
        if (f.qsRankMin > 0) filtered = filtered.filter(u => u.qsRank >= f.qsRankMin);
        if (f.tuitionMin > 0) filtered = filtered.filter(u => u.tuitionRange.max >= f.tuitionMin);
        if (f.tuitionMax < 200000) filtered = filtered.filter(u => u.tuitionRange.min <= f.tuitionMax);
        if (f.categories.length > 0) filtered = filtered.filter(u => u.programs.some(p => f.categories.includes(p.category)));
        if (f.levels.length > 0) filtered = filtered.filter(u => u.programs.some(p => f.levels.includes(p.level)));
        if (f.uniTypes.length > 0) filtered = filtered.filter(u => f.uniTypes.includes(u.type));
        if (f.acceptNoLanguage === true) filtered = filtered.filter(u => u.acceptNoLanguage);
        return filtered;
    }


    function getProfileRecommendations() {
        const p = state.applicantProfile;
        let items = [];
        universities.forEach(u => {
            u.programs.forEach(prog => {
                if (p.level && prog.level !== p.level) return;
                if (p.targetCategory && prog.category !== p.targetCategory) return;
                const annualCost = prog.tuition + u.livingCost;
                let score = 0;
                const reasons = [];
                if (p.gpa >= (prog.requirements.gpa || 0)) { score += 28; reasons.push('学术背景基本匹配'); }
                else if (p.gpa + 0.25 >= (prog.requirements.gpa || 0)) { score += 14; reasons.push('学术背景接近门槛'); }
                if (p.ielts >= (prog.language?.ielts || 0)) { score += 24; reasons.push('语言已达标'); }
                else if (u.acceptNoLanguage && p.acceptNoLanguage) { score += 14; reasons.push('支持先申请后补语言'); }
                if (annualCost <= p.budget) { score += 20; reasons.push('预算可覆盖首年'); }
                else if (annualCost <= p.budget * 1.2) { score += 8; reasons.push('预算略有压力'); }
                if (u.qsRank <= 200) { score += 12; reasons.push('学校层次较强'); }
                else if (u.qsRank <= 500) { score += 7; }
                if (p.experience !== '0-1年' && prog.level === '硕士') { score += 6; reasons.push('工作经验有加分'); }
                if (score >= 28) items.push({ uni: u, prog, score, reasons, annualCost });
            });
        });
        return items.sort((a,b) => b.score - a.score).slice(0, 8);
    }

    function getGeneratedMaterials() {
        const level = state.applicantProfile.level;
        const base = [
            {key:'passport', name:'护照首页扫描件', defaultStatus:'done', note:'建议有效期大于18个月'},
            {key:'photo', name:'白底证件照', defaultStatus:'progress', note:'电子版统一命名，建议 35mm×45mm'},
            {key:'transcript', name:'英文版成绩单', defaultStatus:'progress', note:'需与申请层级对应'},
            {key:'english', name:'英语成绩单', defaultStatus:'wait', note:'可先申请后补的项目也建议尽快准备'}
        ];
        const more = level === '本科' ? [
            {key:'graduation', name:'高中毕业证/预毕业证明', defaultStatus:'wait', note:'如未毕业可先用在读证明'},
            {key:'studyplan', name:'个人陈述', defaultStatus:'draft', note:'突出选专业原因与未来规划'}
        ] : level === '硕士' ? [
            {key:'degree', name:'本科毕业证与学位证', defaultStatus:'progress', note:'中英文件需一致'},
            {key:'studyplan', name:'个人陈述 / Study Plan', defaultStatus:'draft', note:'解释申请动机与职业目标'},
            {key:'recommendation', name:'推荐信 1-2 封', defaultStatus:'wait', note:'优先学术导师或直属上级'}
        ] : [
            {key:'master_degree', name:'硕士学位材料', defaultStatus:'progress', note:'包含成绩单与学位文件'},
            {key:'research', name:'研究计划书', defaultStatus:'draft', note:'建议 1500-3000 字，聚焦研究方向'},
            {key:'cv', name:'学术简历 / 论文成果', defaultStatus:'wait', note:'若有发表请单列'}
        ];
        return base.concat(more).map(m => ({...m, status: state.materialProgress[m.key] || m.defaultStatus}));
    }

    function getStatusWeight(status) {
        return ({draft:0, wait:1, progress:2, done:3})[status] ?? 0;
    }

    function getApplicantSummary() {
        const p = state.applicantProfile;
        const recs = getProfileRecommendations();
        const materials = getGeneratedMaterials();
        const doneCount = materials.filter(m => m.status === 'done').length;
        const inProgressCount = materials.filter(m => m.status === 'progress').length;
        const closest = recs[0];
        const annualCost = closest ? closest.annualCost : 0;
        const readinessScore = Math.max(38, Math.min(96,
            Math.round((doneCount/materials.length)*34 + (inProgressCount/materials.length)*10 + Math.min(p.gpa/3.5,1)*22 + Math.min(p.ielts/6.5,1)*16 + (closest && annualCost <= p.budget ? 14 : 6))
        ));
        let strategy = '建议先完成画像与基础材料，再建立正式申请组合';
        if (p.gpa >= 3.2 && p.ielts >= 6.0) strategy = '可采用“冲刺 + 主申 + 保底”三层结构同步推进';
        else if (p.ielts < 6 && p.acceptNoLanguage) strategy = '优先锁定支持 conditional offer 或语言班衔接的项目';
        else if (p.gpa >= 2.7) strategy = '建议控制名单难度梯度，优先保证主申成功率';
        let nextAction = '先补齐基础材料';
        if (doneCount >= 3 && p.ielts < 6 && p.acceptNoLanguage) nextAction = '优先筛出支持先申后补语言的学校并建立正式申请';
        else if (doneCount >= 4) nextAction = '可以开始建立 3-5 个正式申请项目并规划递交顺序';
        return {
            readinessScore,
            annualCost,
            strategy,
            nextAction,
            profileCompleteness: getProfileCompleteness(),
            materialCompletion: Math.round((doneCount / materials.length) * 100)
        };
    }

    function buildDefaultApplications() {
        return getProfileRecommendations().slice(0, 4).map((r, idx) => ({
            id: `${r.uni.id}-${r.prog.id}`,
            uniId: r.uni.id,
            progId: r.prog.id,
            school: r.uni.name,
            title: r.prog.name,
            annualCost: r.annualCost,
            tier: idx === 0 ? '冲刺' : idx < 3 ? '主申' : '保底',
            stage: idx === 0 ? '待创建' : idx === 1 ? '材料准备中' : idx === 2 ? '待递交' : '院校审核中',
            deadline: idx === 0 ? '建议7天内确认' : idx === 1 ? '建议10天内补齐' : idx === 2 ? '建议14天内递交' : '等待学校反馈',
            next: idx === 0 ? '确认是否纳入正式申请名单' : idx === 1 ? '补推荐信 / 毕业文件 / 语言材料' : idx === 2 ? '完成表单和申请费准备' : '预留补件与跟进时间',
            progress: idx === 0 ? 20 : idx === 1 ? 45 : idx === 2 ? 70 : 82
        }));
    }

        const level = program.level;
        let coreDocs = [];

            return !standardKeywords.some(function(kw) { return doc.includes(kw); }) && doc !== '待更新';
        });

        html += '</div>';
        html += '<div class="space-y-2">';

        coreDocs.forEach(function(doc, i) {
            html += '<div class="border border-gray-100 rounded-xl p-3 bg-gray-50 hover:bg-purple-50 hover:border-purple-100 transition-all">';
            html += '<div class="flex items-start gap-2.5">';
            html += '<span class="w-6 h-6 rounded-full gradient-bg-2 text-white text-xs flex items-center justify-center flex-shrink-0 mt-0.5 font-bold">' + (i + 1) + '</span>';
            html += '<div class="flex-1 min-w-0">';
            html += '<div class="text-sm font-semibold text-gray-800">' + doc.icon + ' ' + doc.label + '</div>';
            html += '<div class="text-xs text-gray-500 mt-1 leading-relaxed">' + doc.note + '</div>';
            html += '</div></div></div>';
        });

        if (extraDocs.length > 0) {
            html += '<div class="mt-2 pt-2 border-t border-dashed border-gray-200">';

            html += '<div class="space-y-1.5">';

            });
            html += '</div></div>';
        }

        html += '</div>';
        html += '<div class="mt-3 p-3 bg-blue-50 border border-blue-100 rounded-xl text-xs text-blue-700 leading-relaxed">💡 <strong>温馨提示：</strong>以上为通用材料清单，具体要求以院校官方录取通知书为准。公证材料通常需要4–8周出具，请提前规划时间。如有疑问请联系招生顾问。</div>';
        html += '</div>';
        return html;
    }

    window.updateCalculator = function() {
        const uniId = parseInt(document.getElementById('calcUniversity')?.value);
        const progSel = document.getElementById('calcProgram');
        const resultDiv = document.getElementById('calcResult');
        if (!uniId) { if(progSel) progSel.innerHTML = '<option value="">请先选择院校</option>'; if(resultDiv) resultDiv.classList.add('hidden'); return; }
        const uni = universities.find(u => u.id === uniId);
        if(progSel) progSel.innerHTML = '<option value="">请选择专业</option>' + uni.programs.map(p => `<option value="${p.id}">${p.name} (${p.level})</option>`).join('');
        const progId = parseInt(progSel?.value);
        if (!progId) { if(resultDiv) resultDiv.classList.add('hidden'); return; }
        const prog = uni.programs.find(p => p.id === progId);
        const tuitionTotal = prog.tuition * prog.duration;
        const livingTotal = uni.livingCost * prog.duration;
        const total = tuitionTotal + livingTotal;
        const details = document.getElementById('calcDetails');
        if(details) details.innerHTML = `
            <div class="flex justify-between"><span class="text-gray-600">学费（${prog.duration}年）</span><span class="font-bold">¥${tuitionTotal.toLocaleString()}</span></div>
            <div class="flex justify-between"><span class="text-gray-600">生活费（${prog.duration}年）</span><span class="font-bold">¥${livingTotal.toLocaleString()}</span></div>`;
        const totalEl = document.getElementById('calcTotal');
        if(totalEl) totalEl.textContent = '¥'+total.toLocaleString();
        if(resultDiv) resultDiv.classList.remove('hidden');
    };
    window.getRecommendations = function() {
        const gaokao = parseInt(document.getElementById('recGaokao')?.value) || 0;
        const gpa = parseFloat(document.getElementById('recGPA')?.value) || (gaokao > 0 ? gaokao/750*4 : 3.0);
        const ielts = parseFloat(document.getElementById('recIELTS')?.value) || 0;
        const budget = parseInt(document.getElementById('recBudget')?.value) || 999999;
        const level = document.querySelector('input[name="recLevel"]:checked')?.value || '硕士';
        let recs = [];
        universities.forEach(uni => {
            const yearCost = uni.tuitionRange.min + uni.livingCost;
            if (yearCost > budget) return;
            uni.programs.forEach(prog => {
                if (prog.level !== level) return;
                let score = 0, reasons = [];
                if (gpa >= prog.requirements.gpa) { score += 35; reasons.push('学术达标'); }
                if (ielts > 0 && ielts >= prog.language.ielts) { score += 30; reasons.push('语言达标'); }
                else if (uni.acceptNoLanguage) { score += 15; reasons.push('可先申请语言'); }
                if ((prog.tuition + uni.livingCost) <= budget) { score += 20; reasons.push('预算匹配'); }
                if (prog.requirements.gaokao && gaokao > 0) { score += 10; reasons.push('可凭高考'); }
                if (uni.qsRank <= 100) score += 15;
                else if (uni.qsRank <= 200) score += 12;
                else if (uni.qsRank <= 400) score += 8;
                if (score >= 25) recs.push({ uni, prog, score, reasons });
            });
        });
        recs.sort((a,b) => b.score - a.score);
        recs = recs.slice(0, 6);
        const listDiv = document.getElementById('recList');
        const resultDiv = document.getElementById('recResults');
        if(listDiv) {
            if (recs.length === 0) {
                listDiv.innerHTML = '<p class="text-gray-500 text-center py-4 text-sm">暂无匹配结果，请调整条件（如提高预算或放宽语言要求）</p>';
            } else {
                listDiv.innerHTML = recs.map(r => `
                <div class="border rounded-xl p-3 hover:border-purple-300 transition cursor-pointer text-sm" onclick="viewProgram(${r.uni.id},${r.prog.id});toggleRecommend();">
                    <div class="flex justify-between items-start">
                        <div>
                            <h4 class="font-bold text-gray-800">${r.prog.name}</h4>
                            <p class="text-xs text-gray-500">${r.uni.name} · QS #${r.uni.qsRank}</p>
                        </div>
                        <span class="px-2 py-1 bg-green-50 text-green-600 text-xs rounded-lg font-bold">${r.score}分匹配</span>
                    </div>
                    <div class="flex flex-wrap gap-1.5 mt-2">
                        ${r.reasons.map(re => `<span class="px-2 py-0.5 bg-purple-50 text-purple-600 text-xs rounded-full">${re}</span>`).join('')}
                    </div>
                    <div class="flex gap-3 mt-1.5 text-xs text-gray-400">
                        <span>¥${(r.prog.tuition/1000).toFixed(0)}k/年</span>
                        <span>雅思${r.prog.language.ielts}+</span>
                        <span>${r.prog.intake.join('/')}</span>
                    </div>
                </div>`).join('');
            }
        }
        if(resultDiv) resultDiv.classList.remove('hidden');
    };

            {stage:'材料准备中', progress:45, next:'补英语成绩 / 推荐信 / 毕业文件', deadline:'建议10天内补齐'},
            {stage:'待递交', progress:70, next:'完成表单和申请费准备', deadline:'建议14天内递交'},

        const nickname = document.getElementById('authNickname')?.value?.trim();
        if (!account || !credential) {
            alert('请先填写账号和验证码/授权信息');
            return;
        }
        state.userAuth = {
            isLoggedIn: true,
            method,
            account,
            nickname: nickname || getMaskedAccount(account, method)
        };
        saveUserAuth();
        state.showAuthModal = false;
        state.currentPage = 'member';
        render();
    };
    window.logoutMember = function() {
        state.userAuth = { isLoggedIn:false, method:'', account:'', nickname:'' };
        state.showAuthModal = false;
        saveUserAuth();
        if (state.currentPage === 'member') state.currentPage = 'home';
        render();
    };

    // 初始化
    render();
    </script>
</body>
</html>
